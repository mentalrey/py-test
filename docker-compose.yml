services:
  py-test:
    container_name: py-test-app
    build:
      context: .
      dockerfile: Dockerfile
    image: py-test:latest
    restart: always
    ports:
      - "8085:80" # Sarà raggiungibile digitando IP-DEL-SERVER:8085

    networks:
      - frontend

networks:
  frontend:
    external: true

